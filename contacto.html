<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contáctanos - PuertoGames</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="logo">PuertoGames</a>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="producto.html">Productos</a></li>
        <li><a href="contacto.html" class="active">Contáctanos</a></li>
      </ul>
    </nav>
  </header>

  <!-- HERO DE CONTACTO CON FORMULARIO ENCIMA DE LA IMAGEN -->
  <section class="contact-hero">
    <img src="assets/img/fondo_contacto_2.jpg" alt="Imagen de contacto" class="contact-hero-bg" />
    <div class="contact-hero-content">
      <h2>Contáctanos</h2>
      <p>¿Tienes alguna duda o quieres enviarnos un mensaje? Completa el formulario abajo.</p>
      <form class="contact-form" action="#" method="post">
        <label for="name">Nombre:</label>
        <input type="text" id="name" name="name" required />

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />

        <label for="message">Mensaje:</label>
        <textarea id="message" name="message" required></textarea>

        <button type="submit" class="cta-button">Enviar</button>
      </form>
    </div>
  </section>

  <footer>
    <p>&copy; 2025 PuertoGames. Todos los derechos reservados.</p>
  </footer>
</body>
</html>
